services:
  # Dependant services
  ## Database (MongoDB) server
  mongodb:
    image: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: testtest
    volumes:
      - data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongodb:27017/test -u admin -p testtest --authenticationDatabase admin --quiet
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  ## Database (MongoDB) GUI
  mongo-express:
    image: mongo-express
    environment:
      - ME_CONFIG_OPTIONS_EDITORTHEME=dracula
      - ME_CONFIG_BASICAUTH=false
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
      - ME_CONFIG_MONGODB_AUTH_USERNAME=admin
      - ME_CONFIG_MONGODB_AUTH_PASSWORD=testtest
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - 8081:8081
    healthcheck:
      test: wget --quiet --tries=3 --spider http://mongo-express:8081 || exit 1
      interval: 7s
      timeout: 5s
      retries: 10
      start_period: 2s

  s3mock:
    image: adobe/s3mock:5.2.3@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
    ports:
      - 9100:9090
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: epp
    healthcheck:
      test: wget -q -O /dev/null http://s3mock:9090/favicon.ico
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s

  createbucket:
    image: amazon/aws-cli:2.37.1
    depends_on:
      s3mock:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      aws s3 cp /automation-data s3://epp/automation --recursive --endpoint-url http://s3mock:9090 --region us-east-1;
      exit 0;
      "
    environment:
      AWS_ACCESS_KEY_ID: s3mock
      AWS_SECRET_ACCESS_KEY: s3mock
    volumes:
      - ./data/automation:/automation-data

  # EPP API
  api:
    build:
      context: .
      target: dev
    healthcheck:
      test: sh -c 'apk add curl; curl http://localhost:3000/'
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 2s
    depends_on:
      mongodb:
        condition: service_healthy
      s3mock:
        condition: service_healthy
      createbucket:
        condition: service_completed_successfully
    environment:
      REPO_TYPE: MongoDB
      REPO_CONNECTION: mongodb:27017
      REPO_USERNAME: admin
      REPO_PASSWORD: testtest

      # EPP S3 bucket
      S3_ENDPOINT: http://s3mock:9090
      AWS_ACCESS_KEY_ID: s3mock
      AWS_SECRET_ACCESS_KEY: s3mock
      BUCKET_NAME: epp
    ports:
      - 3000:3000
    volumes:
      - ./src:/opt/epp/src

  # expose API and client via proxy
  nginx:
    image: nginx:latest
    depends_on:
      api:
        condition: service_healthy
    ports:
      - 8080:80
    volumes:
      - ./.docker/nginx.conf:/etc/nginx/conf.d/default.conf
volumes:
  data: {}
